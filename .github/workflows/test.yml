name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Supersede stale runs: a newer push to the same PR or renovate branch cancels
# the older run; other refs keep at most one pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/renovate/') }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install git
      run: |
        sudo apt-get update
        sudo apt-get install -y git

    - name: Run installer
      run: |
        chmod +x install.sh
        ./install.sh

    - name: Make test executable
      run: chmod +x test.sh

    - name: Run tests
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        ./test.sh
